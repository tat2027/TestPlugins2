name: Build

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Plugins
        run: |
          cd src
          chmod +x gradlew
          ./gradlew makePlugins

      - name: Copy & Push Output
        run: |
          mkdir -p temp_output
          cp -r src/builds/* temp_output/ 2>/dev/null || true
          cp -r src/build/builds/* temp_output/ 2>/dev/null || true
          
          cd builds
          rm -rf *
          cp -r ../temp_output/* . 2>/dev/null || true
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Updated plugin builds [skip ci]" || exit 0
          git push
